# ====================================================================
# Online Shopping Cart and Order Management System
# Application Configuration
# ====================================================================

spring.application.name=online-cart-management
server.port=8080

# Default Database Configuration:
# File-backed H2 running in MySQL Compatibility Mode (MODE=MySQL)
# Ensures identical MySQL DDL, syntax, types, and persistence without external daemon setup.
spring.datasource.url=jdbc:h2:file:./data/online_cart_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# Traditional JDBC Properties (Direct DriverManager Connection)
app.traditional.jdbc.url=jdbc:h2:file:./data/online_cart_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE
app.traditional.jdbc.driver=org.h2.Driver
app.traditional.jdbc.username=sa
app.traditional.jdbc.password=

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Session Configuration
server.servlet.session.timeout=60m
server.servlet.session.cookie.name=CART_SESSION_ID

# Logging
logging.level.root=INFO
logging.level.com.university.cartmanagement=DEBUG
logging.level.org.springframework.jdbc=DEBUG
