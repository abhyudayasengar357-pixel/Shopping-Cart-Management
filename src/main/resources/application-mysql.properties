# ====================================================================
# MySQL Production / Live Database Profile
# Activate via: --spring.profiles.active=mysql
# ====================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/online_cart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# Traditional JDBC Properties for MySQL
app.traditional.jdbc.url=jdbc:mysql://localhost:3306/online_cart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
app.traditional.jdbc.driver=com.mysql.cj.jdbc.Driver
app.traditional.jdbc.username=root
app.traditional.jdbc.password=root
