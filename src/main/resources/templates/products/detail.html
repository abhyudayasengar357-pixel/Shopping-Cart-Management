<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name + ' - Product Specification'}">Product Specification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{layout/navbar :: navbar}"></div>

<main class="py-4">
    <div class="container">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/products}">Catalog</a></li>
                <li class="breadcrumb-item"><a th:href="@{/products(categoryId=${product.categoryId})}" th:text="${product.categoryName}">Category</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${product.name}">Product</li>
            </ol>
        </nav>

        <!-- Product Main Showcase -->
        <div class="card-modern p-4 p-lg-5 mb-5">
            <div class="row g-4 align-items-center">
                <!-- Product Image -->
                <div class="col-lg-5">
                    <div class="p-4 bg-light rounded-1 text-center border">
                        <img th:src="@{${product.imageUrl}}" th:alt="${product.name}" class="img-fluid" style="max-height: 250px; object-fit: contain;">
                    </div>
                </div>

                <!-- Product Information -->
                <div class="col-lg-7">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span class="badge bg-white text-dark border font-monospace" style="font-size: 0.72rem;" th:text="${product.categoryName}">Category</span>
                        <span class="badge" th:classappend="${product.stockStatusBadge}" th:text="${product.stockStatusLabel}">Stock Status</span>
                        <span class="text-muted font-monospace small" style="font-size: 0.72rem;" th:text="'SKU: PROD-' + ${product.id}">SKU: PROD-1</span>
                    </div>

                    <h2 class="fw-bold text-dark fs-3 mb-2" th:text="${product.name}">Product Name</h2>

                    <div class="d-flex align-items-center gap-3 mb-3">
                        <span class="fs-2 fw-bold text-dark num-mono" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                        <span class="badge-status status-delivered">Verified Hardware</span>
                    </div>

                    <p class="text-muted mb-4 small" style="font-size: 0.875rem; line-height: 1.6;" th:text="${product.description}">Detailed product description goes here.</p>

                    <!-- Add to Cart Form -->
                    <form th:action="@{/cart/add}" method="post" class="mt-3">
                        <input type="hidden" name="productId" th:value="${product.id}">

                        <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
                            <!-- Quantity Stepper -->
                            <div class="qty-stepper d-inline-flex align-items-center border rounded-1 p-1 bg-white">
                                <button type="button" class="btn btn-sm btn-link text-dark btn-qty-minus px-2 py-0" th:disabled="${!product.available}">
                                    <i class="bi bi-dash"></i>
                                </button>
                                <input type="number" name="quantity" value="1" min="1" th:max="${product.stockQuantity}"
                                       class="form-control form-control-sm text-center border-0 fw-bold num-mono" style="width: 55px;"
                                       th:disabled="${!product.available}">
                                <button type="button" class="btn btn-link btn-sm text-dark btn-qty-plus px-2 py-0" th:disabled="${!product.available}">
                                    <i class="bi bi-plus"></i>
                                </button>
                            </div>

                            <button type="submit" class="btn btn-modern-primary py-2 px-3 fw-semibold" th:disabled="${!product.available}">
                                <i class="bi bi-cart-plus me-1"></i>
                                <span>Add to Cart</span>
                            </button>
                        </div>
                    </form>

                    <!-- Trust Specifications -->
                    <div class="row g-3 pt-3 border-top small text-muted font-monospace" style="font-size: 0.75rem;">
                        <div class="col-sm-4 d-flex align-items-center gap-2">
                            <i class="bi bi-box text-dark"></i>
                            <span th:text="${'Units: ' + product.stockQuantity + ' in stock'}">Units: 10</span>
                        </div>
                        <div class="col-sm-4 d-flex align-items-center gap-2">
                            <i class="bi bi-truck text-dark"></i>
                            <span>Express Dispatch</span>
                        </div>
                        <div class="col-sm-4 d-flex align-items-center gap-2">
                            <i class="bi bi-shield-check text-dark"></i>
                            <span>ACID Transaction</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Related Products Section -->
        <div th:if="${!relatedProducts.empty}">
            <div class="d-flex justify-content-between align-items-end mb-3 pb-2 border-bottom">
                <h5 class="fw-bold text-dark mb-0 fs-5">Related Catalog Hardware</h5>
                <a th:href="@{/products}" class="text-dark small fw-semibold">View All &rarr;</a>
            </div>

            <div class="row g-3">
                <div class="col-6 col-md-3" th:each="rel : ${relatedProducts}">
                    <div class="card-modern h-100 d-flex flex-column">
                        <div class="product-image-container" style="height: 160px;">
                            <img th:src="@{${rel.imageUrl}}" th:alt="${rel.name}" class="product-img" style="max-height: 110px;">
                        </div>
                        <div class="p-3 d-flex flex-column flex-grow-1">
                            <h6 class="fw-bold text-dark mb-1 small text-truncate">
                                <a th:href="@{/products/{id}(id=${rel.id})}" class="text-dark text-decoration-none" th:text="${rel.name}">Product</a>
                            </h6>
                            <div class="mt-auto d-flex justify-content-between align-items-center pt-2 border-top">
                                <span class="fw-bold text-dark num-mono small" th:text="'$' + ${#numbers.formatDecimal(rel.price, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                                <a th:href="@{/products/{id}(id=${rel.id})}" class="btn btn-sm-modern btn-modern-secondary py-1 px-2">Inspect</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
