<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found (404) - Online Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{layout/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container text-center py-5" style="max-width: 580px;">
        <div class="display-3 fw-bold text-dark font-monospace mb-2">404</div>
        <h4 class="fw-bold text-dark mb-2">Resource Not Found</h4>
        <p class="text-muted small mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested item identifier or route does not exist in the catalog.'}">
            The requested resource could not be found.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/}" class="btn btn-sm-modern btn-modern-primary py-2 px-3">Return to Home</a>
            <a th:href="@{/products}" class="btn btn-sm-modern btn-modern-secondary py-2 px-3">Product Catalog</a>
        </div>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
