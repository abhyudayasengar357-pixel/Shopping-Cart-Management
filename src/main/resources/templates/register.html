<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration - Online Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{layout/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="auth-card" style="max-width: 520px;">
            <div class="text-center mb-4 pb-2 border-bottom">
                <img th:src="@{/images/logo.svg}" alt="Logo" width="36" height="36" class="mb-2">
                <h3 class="fw-bold text-dark fs-4 mb-1">Create Customer Account</h3>
                <p class="text-muted small mb-0">Register a persistent customer profile for cart &amp; order transactions</p>
            </div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <!-- Full Name -->
                <div class="mb-3">
                    <label class="form-label">Full Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{fullName}" class="form-control form-control-modern"
                           placeholder="e.g. Alex Johnson" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="row g-3 mb-3">
                    <!-- Username -->
                    <div class="col-md-6">
                        <label class="form-label">Username <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{username}" class="form-control form-control-modern font-monospace"
                               placeholder="e.g. alexj" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6">
                        <label class="form-label">Email Address <span class="text-danger">*</span></label>
                        <input type="email" th:field="*{email}" class="form-control form-control-modern font-monospace"
                               placeholder="alex@example.com" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <!-- Password -->
                    <div class="col-md-6">
                        <label class="form-label">Password <span class="text-danger">*</span></label>
                        <input type="password" th:field="*{password}" class="form-control form-control-modern"
                               placeholder="Min 6 characters" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <!-- Phone -->
                    <div class="col-md-6">
                        <label class="form-label">Telephone</label>
                        <input type="text" th:field="*{phone}" class="form-control form-control-modern font-monospace"
                               placeholder="+1-555-0123">
                    </div>
                </div>

                <!-- Address -->
                <div class="mb-4">
                    <label class="form-label">Default Shipping Address</label>
                    <textarea th:field="*{address}" rows="2" class="form-control form-control-modern"
                              placeholder="Street address, city, state, postal code"></textarea>
                </div>

                <button type="submit" class="btn btn-modern-primary w-100 py-2 fw-semibold mb-3">
                    <i class="bi bi-person-check me-1"></i> Register Account
                </button>
            </form>

            <div class="text-center small text-muted">
                Already registered in the ledger?
                <a th:href="@{/login}" class="text-dark fw-semibold ms-1">Sign In instead</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
