<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Online Shopping System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{layout/navbar :: navbar}"></div>

<main class="py-4">
    <div class="container" style="max-width: 840px;">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">User Profile</li>
            </ol>
        </nav>

        <div class="pb-3 mb-4 border-bottom">
            <h2 class="fw-bold text-dark fs-3 mb-1">Authenticated Account Profile</h2>
            <p class="text-muted small mb-0">Manage security credentials, contact numbers, and default fulfillment destinations.</p>
        </div>

        <div class="row g-4">
            <!-- Left: Profile Summary Card -->
            <div class="col-md-4">
                <div class="card-modern p-3 text-center">
                    <div class="mx-auto mb-3" style="width: 56px; height: 56px; background: var(--bg-subtle); color: var(--black); border: 1px solid var(--border-color); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                        <i class="bi bi-person"></i>
                    </div>
                    <h5 class="fw-bold text-dark mb-1 fs-6" th:text="${user.fullName}">Full Name</h5>
                    <p class="text-muted small font-monospace mb-2" th:text="'@' + ${user.username}">@username</p>
                    <span class="badge" th:classappend="${user.admin ? 'bg-dark text-white' : 'bg-light text-dark border font-monospace'}" th:text="${user.role.displayName}">Role</span>

                    <hr class="border-subtle my-3">

                    <div class="text-start small text-muted font-monospace" style="font-size: 0.75rem;">
                        <div class="mb-2 text-truncate"><i class="bi bi-envelope me-2 text-dark"></i><span th:text="${user.email}">email</span></div>
                        <div class="mb-2"><i class="bi bi-telephone me-2 text-dark"></i><span th:text="${user.phone != null and user.phone != '' ? user.phone : 'Unset'}">phone</span></div>
                        <div><i class="bi bi-calendar-event me-2 text-dark"></i>Enrolled: <span th:text="${#temporals.format(user.createdAt, 'MMM yyyy')}">2026</span></div>
                    </div>
                </div>
            </div>

            <!-- Right: Edit Details & Password -->
            <div class="col-md-8">
                <!-- Update Details Card -->
                <div class="card-modern p-3 mb-3">
                    <h6 class="fw-bold text-dark mb-3 pb-2 border-bottom text-uppercase small" style="letter-spacing: 0.05em;">Contact &amp; Shipping Profile</h6>
                    <form th:action="@{/profile}" th:object="${user}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" th:field="*{fullName}" class="form-control form-control-modern" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Handle (Read-Only)</label>
                                <input type="text" th:value="${user.username}" class="form-control form-control-modern bg-light font-monospace" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email Address (Read-Only)</label>
                                <input type="email" th:value="${user.email}" class="form-control form-control-modern bg-light font-monospace" readonly>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contact Telephone</label>
                            <input type="text" th:field="*{phone}" class="form-control form-control-modern font-monospace"
                                   placeholder="+1-555-0123">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Default Shipping Destination</label>
                            <textarea th:field="*{address}" rows="3" class="form-control form-control-modern"
                                      placeholder="Primary shipping address for automatic checkout prefill"></textarea>
                        </div>

                        <button type="submit" class="btn btn-modern-primary btn-sm-modern py-2 px-3">
                            <i class="bi bi-check2 me-1"></i> Update Profile Details
                        </button>
                    </form>
                </div>

                <!-- Update Password Card -->
                <div class="card-modern p-3">
                    <h6 class="fw-bold text-dark mb-3 pb-2 border-bottom text-uppercase small" style="letter-spacing: 0.05em;">Security &amp; BCrypt Password</h6>
                    <form th:action="@{/profile/password}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Current Password</label>
                            <input type="password" name="currentPassword" class="form-control form-control-modern" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" name="newPassword" class="form-control form-control-modern"
                                   placeholder="Minimum 6 characters" required>
                        </div>

                        <button type="submit" class="btn btn-modern-secondary btn-sm-modern py-2 px-3">
                            <i class="bi bi-shield-lock me-1"></i> Change Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
