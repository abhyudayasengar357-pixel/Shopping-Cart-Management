<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{layout/navbar :: navbar}"></div>

<main class="py-4">
    <div class="container">
        <!-- Breadcrumb & Top Bar -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Admin</a></li>
                <li class="breadcrumb-item active" aria-current="page">Catalog Management</li>
            </ol>
        </nav>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 pb-3 mb-4 border-bottom">
            <div>
                <h2 class="fw-bold text-dark fs-3 mb-1">Product Inventory Ledger</h2>
                <p class="text-muted small mb-0">Inspect merchandise, adjust stock reserves, and manage product catalog data.</p>
            </div>
            <a th:href="@{/admin/products/new}" class="btn btn-sm-modern btn-modern-primary">
                <i class="bi bi-plus-lg me-1"></i> Add New Product
            </a>
        </div>

        <!-- Products Table -->
        <div class="card-modern p-0">
            <div class="table-responsive">
                <table class="table table-modern align-middle mb-0">
                    <thead>
                        <tr>
                            <th style="width: 40px;">#</th>
                            <th style="min-width: 250px;">Product Name &amp; Status</th>
                            <th>Category</th>
                            <th>Unit Price</th>
                            <th>Stock Quantity</th>
                            <th>Featured</th>
                            <th class="text-end" style="min-width: 140px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td class="text-muted font-monospace small" th:text="${product.id}">1</td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="p-1 bg-white rounded-1 text-center border" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                                        <img th:src="@{${product.imageUrl}}" th:alt="${product.name}" class="img-fluid" style="max-height: 30px;">
                                    </div>
                                    <div>
                                        <div class="fw-semibold text-dark small" th:text="${product.name}">Product Name</div>
                                        <span class="badge" th:classappend="${product.stockStatusBadge}" th:text="${product.stockStatusLabel}">In Stock</span>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border font-monospace" style="font-size: 0.72rem;" th:text="${product.categoryName}">Category</span>
                            </td>
                            <td class="fw-bold text-dark num-mono" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">$0.00</td>

                            <!-- Quick Stock Adjuster Form -->
                            <td>
                                <form th:action="@{/admin/products/stock}" method="post" class="d-inline-flex align-items-center gap-1">
                                    <input type="hidden" name="productId" th:value="${product.id}">
                                    <input type="number" name="stockQuantity" th:value="${product.stockQuantity}" min="0"
                                           class="form-control form-control-sm form-control-modern text-center fw-bold num-mono" style="width: 65px;">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary p-1" title="Save stock changes">
                                        <i class="bi bi-check-lg"></i>
                                    </button>
                                </form>
                            </td>

                            <td>
                                <span th:if="${product.featured}" class="badge bg-dark text-white font-monospace" style="font-size: 0.68rem;">FEATURED</span>
                                <span th:unless="${product.featured}" class="text-muted font-monospace small">&mdash;</span>
                            </td>

                            <td class="text-end">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-outline-secondary p-1" title="Edit Product">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Are you sure you want to delete this product?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger p-1" title="Delete Product">
                                            <i class="bi bi-trash3"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
