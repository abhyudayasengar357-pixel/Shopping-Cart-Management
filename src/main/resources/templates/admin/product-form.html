<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Product Form - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{layout/navbar :: navbar}"></div>

<main class="py-4">
    <div class="container" style="max-width: 760px;">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Admin</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/products}">Products</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${product.id == null ? 'New' : 'Edit'}">Form</li>
            </ol>
        </nav>

        <div class="card-modern p-4">
            <h4 class="fw-bold text-dark mb-4 pb-2 border-bottom fs-5" th:text="${pageTitle}">Add / Edit Product</h4>

            <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
                <input type="hidden" th:field="*{id}">

                <!-- Product Name -->
                <div class="mb-3">
                    <label class="form-label">Product Name / Title <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control form-control-modern"
                           placeholder="e.g. Wireless Noise-Cancelling Headphones" required>
                    <div class="text-danger small mt-1 font-monospace" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="row g-3 mb-3">
                    <!-- Category Selection -->
                    <div class="col-md-6">
                        <label class="form-label">Category <span class="text-danger">*</span></label>
                        <select th:field="*{categoryId}" class="form-select form-select-modern" required>
                            <option value="">-- Select Category --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                        </select>
                        <div class="text-danger small mt-1 font-monospace" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                    </div>

                    <!-- Price -->
                    <div class="col-md-6">
                        <label class="form-label">Unit Price ($) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" min="0.01" th:field="*{price}" class="form-control form-control-modern num-mono"
                               placeholder="29.99" required>
                        <div class="text-danger small mt-1 font-monospace" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <!-- Stock Quantity -->
                    <div class="col-md-6">
                        <label class="form-label">Initial Inventory Reserve <span class="text-danger">*</span></label>
                        <input type="number" min="0" th:field="*{stockQuantity}" class="form-control form-control-modern num-mono"
                               placeholder="25" required>
                        <div class="text-danger small mt-1 font-monospace" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
                    </div>

                    <!-- Image Asset Selector -->
                    <div class="col-md-6">
                        <label class="form-label">Vector Asset</label>
                        <select th:field="*{imageUrl}" class="form-select form-select-modern font-monospace small">
                            <option value="/images/products/laptop.svg">laptop.svg (Electronics)</option>
                            <option value="/images/products/headphones.svg">headphones.svg (Audio)</option>
                            <option value="/images/products/smartwatch.svg">smartwatch.svg (Wearables)</option>
                            <option value="/images/products/keyboard.svg">keyboard.svg (Accessories)</option>
                            <option value="/images/products/denim_jacket.svg">denim_jacket.svg (Fashion)</option>
                            <option value="/images/products/running_shoes.svg">running_shoes.svg (Apparel)</option>
                            <option value="/images/products/backpack.svg">backpack.svg (Bags)</option>
                            <option value="/images/products/algo_book.svg">algo_book.svg (Textbook)</option>
                            <option value="/images/products/cleancode_book.svg">cleancode_book.svg (Software)</option>
                            <option value="/images/products/coffee_mug.svg">coffee_mug.svg (Kitchen)</option>
                            <option value="/images/products/office_chair.svg">office_chair.svg (Furniture)</option>
                            <option value="/images/products/dumbbells.svg">dumbbells.svg (Fitness)</option>
                        </select>
                    </div>
                </div>

                <!-- Featured Checkbox -->
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" th:field="*{featured}" id="featuredSwitch">
                    <label class="form-check-label small fw-semibold text-dark" for="featuredSwitch">Promote as Featured Item on Home Page</label>
                </div>

                <!-- Description -->
                <div class="mb-4">
                    <label class="form-label">Product Technical Description</label>
                    <textarea th:field="*{description}" rows="4" class="form-control form-control-modern"
                              placeholder="Hardware specifications, dimensions, features..."></textarea>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-modern-primary btn-sm-modern py-2 px-3">
                        <i class="bi bi-check-lg me-1"></i> Persist Product
                    </button>
                    <a th:href="@{/admin/products}" class="btn btn-modern-secondary btn-sm-modern py-2 px-3">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
