<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Directory - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{layout/navbar :: navbar}"></div>

<main class="py-4">
    <div class="container">
        <!-- Breadcrumb & Top Bar -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Admin</a></li>
                <li class="breadcrumb-item active" aria-current="page">Customer Directory</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
            <div>
                <h2 class="fw-bold text-dark fs-3 mb-1">Registered Customer Ledger</h2>
                <p class="text-muted small mb-0">Browse authenticated user accounts, verified emails, and role privileges.</p>
            </div>
        </div>

        <div class="card-modern p-0">
            <div class="table-responsive">
                <table class="table table-modern align-middle mb-0">
                    <thead>
                        <tr>
                            <th style="width: 40px;">#</th>
                            <th>Customer Name</th>
                            <th>Handle</th>
                            <th>Email Address</th>
                            <th>Telephone</th>
                            <th>Role Scope</th>
                            <th>Registration Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cust : ${customers}">
                            <td class="text-muted font-monospace small" th:text="${cust.id}">1</td>
                            <td class="fw-semibold text-dark small" th:text="${cust.fullName}">Full Name</td>
                            <td class="text-muted font-monospace small" th:text="'@' + ${cust.username}">@user</td>
                            <td class="small font-monospace" th:text="${cust.email}">email@domain.com</td>
                            <td class="small text-muted font-monospace" th:text="${cust.phone != null and cust.phone != '' ? cust.phone : 'N/A'}">Phone</td>
                            <td>
                                <span class="badge" th:classappend="${cust.admin ? 'bg-dark text-white' : 'bg-light text-dark border font-monospace'}"
                                      th:text="${cust.role.displayName}">Role</span>
                            </td>
                            <td class="small text-muted font-monospace" th:text="${#temporals.format(cust.createdAt, 'dd MMM yyyy')}">Date</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
