<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Online Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{layout/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="auth-card">
            <!-- Header -->
            <div class="text-center mb-4 pb-2 border-bottom">
                <img th:src="@{/images/logo.svg}" alt="Logo" width="36" height="36" class="mb-2">
                <h3 class="fw-bold text-dark fs-4 mb-1">Authenticate Session</h3>
                <p class="text-muted small mb-1">Enter credentials to access customer or administrator portals</p>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control form-control-modern border-start-0" id="username" name="username"
                               placeholder="e.g. admin or john_doe" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control form-control-modern border-start-0" id="password" name="password"
                               placeholder="Password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-modern-primary w-100 py-2 fw-semibold mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>

            <div class="text-center small text-muted">
                Need a new customer profile?
                <a th:href="@{/register}" class="text-dark fw-semibold ms-1">Register Account</a>
            </div>

            <!-- Demo Credentials Quick-Fill Box for Testing & Evaluation -->
            <div class="demo-credentials-box mt-4">
                <div class="fw-bold text-dark mb-2 d-flex align-items-center justify-content-between">
                    <span class="font-monospace small"><i class="bi bi-key-fill text-dark me-1"></i> Pre-seeded Test Credentials</span>
                    <span class="text-muted font-monospace" style="font-size: 0.7rem;">Click to Autofill</span>
                </div>
                <div class="d-flex flex-column gap-1">
                    <button type="button" class="quick-fill-btn text-start d-flex justify-content-between align-items-center" data-user="admin" data-pass="admin123">
                        <span><i class="bi bi-shield-lock me-1"></i> <strong>admin</strong> (Administrator)</span>
                        <span class="text-muted">admin123</span>
                    </button>
                    <button type="button" class="quick-fill-btn text-start d-flex justify-content-between align-items-center" data-user="john_doe" data-pass="password123">
                        <span><i class="bi bi-person me-1"></i> <strong>john_doe</strong> (Customer)</span>
                        <span class="text-muted">password123</span>
                    </button>
                    <button type="button" class="quick-fill-btn text-start d-flex justify-content-between align-items-center" data-user="jane_smith" data-pass="password123">
                        <span><i class="bi bi-person me-1"></i> <strong>jane_smith</strong> (Customer)</span>
                        <span class="text-muted">password123</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
